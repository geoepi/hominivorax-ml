<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="100%" height="100%" fill="#ffffff"/><title>Nearest point distance by temporal lag</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20303f}.title{font-size:22px;font-weight:700}.label{font-size:13px}.small{font-size:11px;fill:#526273}.axis{stroke:#526273;stroke-width:1}.grid{stroke:#dce3e9;stroke-width:1}.line{fill:none;stroke-width:2.2}</style><text x="78" y="42" class="title">Nearest point distance by exact temporal lag</text><line x1="95" y1="450.0" x2="850" y2="450.0" class="grid"/><text x="83" y="454.0" text-anchor="end" class="small">0</text><line x1="95" y1="425.8" x2="850" y2="425.8" class="grid"/><text x="83" y="429.8" text-anchor="end" class="small">5</text><line x1="95" y1="401.5" x2="850" y2="401.5" class="grid"/><text x="83" y="405.5" text-anchor="end" class="small">10</text><line x1="95" y1="328.9" x2="850" y2="328.9" class="grid"/><text x="83" y="332.9" text-anchor="end" class="small">25</text><line x1="95" y1="207.7" x2="850" y2="207.7" class="grid"/><text x="83" y="211.7" text-anchor="end" class="small">50</text><line x1="95" y1="90" x2="95" y2="450" class="axis"/><line x1="95" y1="450" x2="850" y2="450" class="axis"/><text x="28" y="270" transform="rotate(-90 28 270)" class="label">Distance (km)</text><text x="470" y="520" text-anchor="middle" class="label">Reference period</text><line x1="140.0" y1="450.0" x2="140.0" y2="383.5" stroke="#a9bdc6" stroke-width="8"/><line x1="140.0" y1="450.0" x2="140.0" y2="421.3" stroke="#087e8b" stroke-width="13"/><circle cx="140.0" cy="443.0" r="5" fill="#e07a28"/><text x="140.0" y="475" text-anchor="middle" class="small">Same week</text><line x1="250.8" y1="450.0" x2="250.8" y2="327.1" stroke="#a9bdc6" stroke-width="8"/><line x1="250.8" y1="442.9" x2="250.8" y2="390.5" stroke="#087e8b" stroke-width="13"/><circle cx="250.8" cy="425.8" r="5" fill="#e07a28"/><text x="250.8" y="475" text-anchor="middle" c